<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>転職先候補リスト</title>
<style>
:root{--bg:#f6f4ef;--card:#fff;--ink:#2b2b2b;--muted:#8a8578;--accent:#4472c4;--star:#e8a100;--danger:#c0392b;--new:#1e8e3e}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,"Hiragino Kaku Gothic ProN","Noto Sans JP",sans-serif;background:var(--bg);color:var(--ink);line-height:1.6}
.hidden{display:none!important}
/* login */
#loginView{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.login-box{background:var(--card);border-radius:16px;padding:36px 32px;max-width:380px;width:100%;box-shadow:0 4px 24px rgba(0,0,0,.08);text-align:center}
.login-box h1{font-size:20px;margin-bottom:8px}
.login-box p{color:var(--muted);font-size:13px;margin-bottom:20px}
.login-box input{width:100%;padding:12px;border:1px solid #ddd;border-radius:8px;font-size:16px;margin-bottom:12px}
.login-box button{width:100%;padding:12px;background:var(--accent);color:#fff;border:none;border-radius:8px;font-size:16px;cursor:pointer}
.login-err{color:var(--danger);font-size:13px;margin-top:10px;min-height:20px}
/* header */
header{position:sticky;top:0;z-index:10;background:var(--card);border-bottom:1px solid #e5e1d8;padding:10px 16px}
header h1{font-size:17px}
header .sub{font-size:11px;color:var(--muted)}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.toolbar input[type=search]{flex:1;min-width:140px;padding:8px 10px;border:1px solid #ddd;border-radius:8px;font-size:14px}
.toolbar select{padding:8px;border:1px solid #ddd;border-radius:8px;font-size:13px;background:#fff}
.chip-toggle{padding:8px 12px;border:1px solid #ddd;border-radius:20px;font-size:13px;background:#fff;cursor:pointer}
.chip-toggle.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.count{font-size:12px;color:var(--muted);margin-top:6px}
/* cards */
main{max-width:860px;margin:0 auto;padding:16px 12px 120px}
.card{background:var(--card);border-radius:12px;padding:14px;margin-bottom:12px;box-shadow:0 1px 4px rgba(0,0,0,.05)}
.card.caution{border-left:4px solid var(--danger)}
.card-top{display:flex;gap:8px;align-items:flex-start}
.star{font-size:22px;cursor:pointer;color:#ddd;background:none;border:none;line-height:1;padding:2px}
.star.on{color:var(--star)}
.card-main{flex:1;min-width:0}
.company{font-weight:700;font-size:15px}
.position{font-size:13px;margin-top:2px}
.badges{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.badge{font-size:11px;background:#f0ede6;border-radius:12px;padding:2px 10px;color:#5a5648}
.badge.new{background:#e6f4ea;color:var(--new);font-weight:700}
.badge.cat{background:#e8eefb;color:var(--accent)}
.badge.warn{background:#fdecea;color:var(--danger)}
.card-actions{display:flex;gap:8px;align-items:center;margin-top:10px;flex-wrap:wrap}
.card-actions select{padding:6px;border:1px solid #ddd;border-radius:6px;font-size:13px}
.mini-btn{font-size:12px;padding:6px 10px;border:1px solid #ddd;border-radius:6px;background:#fff;cursor:pointer}
.mini-btn.danger{color:var(--danger)}
.details{margin-top:10px;font-size:13px;border-top:1px dashed #e5e1d8;padding-top:10px}
.details dt{font-weight:700;font-size:12px;color:var(--muted);margin-top:8px}
.details dd{margin:2px 0 0;white-space:pre-wrap}
.details a{color:var(--accent);word-break:break-all}
.memo{width:100%;margin-top:10px;padding:8px;border:1px solid #ddd;border-radius:8px;font-size:13px;min-height:56px;resize:vertical;font-family:inherit}
.memo-saved{font-size:11px;color:var(--new);margin-top:2px;min-height:16px}
/* fab + modal */
#fab{position:fixed;right:20px;bottom:24px;width:56px;height:56px;border-radius:50%;background:var(--accent);color:#fff;font-size:28px;border:none;cursor:pointer;box-shadow:0 4px 12px rgba(0,0,0,.2)}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.4);display:flex;align-items:center;justify-content:center;padding:16px;z-index:20}
.modal-box{background:#fff;border-radius:12px;padding:20px;max-width:520px;width:100%;max-height:90vh;overflow:auto}
.modal-box h2{font-size:16px;margin-bottom:12px}
.modal-box label{display:block;font-size:12px;color:var(--muted);margin-top:10px}
.modal-box input,.modal-box textarea,.modal-box select{width:100%;padding:8px;border:1px solid #ddd;border-radius:6px;font-size:14px;margin-top:2px;font-family:inherit}
.modal-box textarea{min-height:70px}
.modal-btns{display:flex;gap:8px;margin-top:16px}
.modal-btns button{flex:1;padding:10px;border-radius:8px;font-size:14px;cursor:pointer}
.btn-primary{background:var(--accent);color:#fff;border:none}
.btn-secondary{background:#f0ede6;border:none}
.badge.curated{background:#fff4e0;color:#b7791f;font-weight:700}
.loading{text-align:center;color:var(--muted);padding:40px}
.err-box{background:#fdecea;color:var(--danger);border-radius:8px;padding:12px;margin-bottom:12px;font-size:13px}
</style>
</head>
<body>

<div id="loginView" class="hidden">
  <div class="login-box">
    <h1>転職先候補リスト</h1>
    <p>パスコードを入力してね</p>
    <input type="password" id="passcode" placeholder="パスコード" autocomplete="off">
    <button id="loginBtn">開く</button>
    <div class="login-err" id="loginErr"></div>
  </div>
</div>

<div id="appView" class="hidden">
  <header>
    <h1>転職先候補リスト</h1>
    <div class="sub" id="updatedAt"></div>
    <div class="toolbar">
      <input type="search" id="q" placeholder="会社名・ポジションで検索">
      <select id="fCat"><option value="">全カテゴリ</option></select>
      <select id="fStatus">
        <option value="">全ステータス</option>
        <option>未検討</option><option>気になる</option><option>応募済み</option>
        <option>選考中</option><option>見送り</option>
      </select>
      <button class="chip-toggle" id="fStar">★のみ</button>
      <button class="chip-toggle" id="fCurated">厳選のみ</button>
      <button class="chip-toggle" id="fNew">新着のみ</button>
      <button class="chip-toggle" id="fCaution">要注意のみ</button>
    </div>
    <div class="count" id="count"></div>
  </header>
  <main id="list"></main>
  <button id="fab" title="追加">＋</button>
</div>

<div id="modal" class="modal hidden">
  <div class="modal-box">
    <h2>求人を追加</h2>
    <div id="addErr" class="err-box hidden"></div>
    <label>会社名 *<input id="aCompany"></label>
    <label>ポジション *<input id="aPosition"></label>
    <label>カテゴリ<input id="aCategory" placeholder="例： 新着ウォッチ"></label>
    <label>想定年収<input id="aSalary"></label>
    <label>勤務地<input id="aLocation"></label>
    <label>リモート<input id="aRemote"></label>
    <label>事業内容<textarea id="aBusiness"></textarea></label>
    <label>応募要件・経験年数<textarea id="aReq"></textarea></label>
    <label>フィット理由<textarea id="aFit"></textarea></label>
    <label>求人URL<input id="aUrl"></label>
    <div class="modal-btns">
      <button class="btn-secondary" id="addCancel">キャンセル</button>
      <button class="btn-primary" id="addSave">追加する</button>
    </div>
  </div>
</div>

<script>
let DATA = [];
const STATUSES = ['未検討','気になる','応募済み','選考中','見送り'];
const $ = id => document.getElementById(id);

function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function isNew(it){if(!it.addedAt)return false;return (Date.now()-new Date(it.addedAt).getTime())<14*864e5}

async function api(path,opts={}){
  const r = await fetch(path,{headers:{'Content-Type':'application/json'},...opts});
  if(r.status===401){location.reload();throw new Error('unauthorized')}
  const j = await r.json().catch(()=>({}));
  if(!r.ok)throw new Error(j.error||('http '+r.status));
  return j;
}

async function boot(){
  const me = await api('/api/me').catch(()=>({authenticated:false}));
  if(me.authenticated){showApp()}else{$('loginView').classList.remove('hidden');$('passcode').focus()}
}
async function doLogin(){
  const p=$('passcode').value;
  $('loginErr').textContent='';
  try{
    await api('/api/login',{method:'POST',body:JSON.stringify({passcode:p})});
    showApp();
  }catch(e){$('loginErr').textContent='パスコードが違うみたい';}
}
async function showApp(){
  $('loginView').classList.add('hidden');
  $('appView').classList.remove('hidden');
  $('list').innerHTML='<div class="loading">読み込み中…</div>';
  try{
    const d=await api('/api/listings');
    DATA=d.listings||[];
    if(d.updatedAt)$('updatedAt').textContent='更新: '+new Date(d.updatedAt).toLocaleString('ja-JP');
    buildCatFilter();render();
  }catch(e){
    $('list').innerHTML='<div class="err-box">読み込めなかったよ： '+esc(e.message)+'</div>';
  }
}
function buildCatFilter(){
  const cats=[...new Set(DATA.map(x=>x.category).filter(Boolean))];
  $('fCat').innerHTML='<option value="">全カテゴリ</option>'+cats.map(c=>`<option>${esc(c)}</option>`).join('');
}
function filtered(){
  const q=$('q').value.trim().toLowerCase(),c=$('fCat').value,s=$('fStatus').value;
  const st=$('fStar').classList.contains('on'),cu=$('fCurated').classList.contains('on'),nw=$('fNew').classList.contains('on'),ca=$('fCaution').classList.contains('on');
  return DATA.filter(x=>{
    if(q&&!(x.company+' '+x.position).toLowerCase().includes(q))return false;
    if(c&&x.category!==c)return false;
    if(s&&x.status!==s)return false;
    if(st&&!x.starred)return false;
    if(cu&&!x.curated)return false;
    if(nw&&!isNew(x))return false;
    if(ca&&!x.caution)return false;
    return true;
  });
}
function render(){
  const items=filtered();
  $('count').textContent=items.length+' 件 / 全 '+DATA.length+' 件';
  $('list').innerHTML=items.map(card).join('')||'<div class="loading">該当なし</div>';
  items.forEach(bindCard);
}
function card(x){
  const open=false;
  return `<div class="card${x.caution?' caution':''}" data-id="${esc(x.id)}">
    <div class="card-top">
      <button class="star${x.starred?' on':''}" data-act="star" title="お気に入り">★</button>
      <div class="card-main">
        <div class="company">${esc(x.company)}</div>
        <div class="position">${esc(x.position)}</div>
        <div class="badges">
          ${x.salary?`<span class="badge">${esc(x.salary)}</span>`:''}
          ${x.location?`<span class="badge">${esc(x.location)}</span>`:''}
          ${x.remote?`<span class="badge">${esc(x.remote)}</span>`:''}
          ${x.category?`<span class="badge cat">${esc(x.category)}</span>`:''}
          ${isNew(x)?'<span class="badge new">NEW</span>':''}
          ${x.curated?'<span class="badge curated">厳選</span>':''}
          ${x.caution?'<span class="badge warn">要注意</span>':''}
        </div>
        <div class="card-actions">
          <select data-act="status">${STATUSES.map(s=>`<option${s===x.status?' selected':''}>${s}</option>`).join('')}</select>
          <button class="mini-btn" data-act="caution">${x.caution?'要注意を外す':'要注意にする'}</button>
          <button class="mini-btn" data-act="curated">${x.curated?'厳選を外す':'厳選に入れる'}</button>
          <button class="mini-btn" data-act="detail">詳細</button>
          ${x.url?`<a class="mini-btn" href="${esc(x.url)}" target="_blank" rel="noopener">求人ページ</a>`:''}
          <button class="mini-btn danger" data-act="del">削除</button>
        </div>
        <textarea class="memo" data-act="memo" placeholder="メモ…">${esc(x.memo||'')}</textarea>
        <div class="memo-saved" data-act="memosaved"></div>
        <dl class="details hidden" data-act="details">
          ${x.business?`<dt>事業内容</dt><dd>${esc(x.business)}</dd>`:''}
          ${x.requirements?`<dt>応募要件・経験年数</dt><dd>${esc(x.requirements)}</dd>`:''}
          ${x.fit?`<dt>フィット理由</dt><dd>${esc(x.fit)}</dd>`:''}
        </dl>
      </div>
    </div>
  </div>`;
}
function bindCard(x){
  const el=document.querySelector(`.card[data-id="${CSS.escape(x.id)}"]`);
  if(!el)return;
  el.querySelector('[data-act=star]').onclick=async e=>{await patch(x.id,{starred:!x.starred});};
  el.querySelector('[data-act=status]').onchange=async e=>{await patch(x.id,{status:e.target.value});};
  el.querySelector('[data-act=caution]').onclick=async e=>{await patch(x.id,{caution:!x.caution});};
  el.querySelector('[data-act=curated]').onclick=async e=>{await patch(x.id,{curated:!x.curated});};
  el.querySelector('[data-act=detail]').onclick=()=>{el.querySelector('[data-act=details]').classList.toggle('hidden');};
  el.querySelector('[data-act=del]').onclick=async ()=>{
    if(!confirm('削除する？'))return;
    await api('/api/listings/'+encodeURIComponent(x.id),{method:'DELETE'});
    DATA=DATA.filter(y=>y.id!==x.id);render();
  };
  const memo=el.querySelector('[data-act=memo]'),saved=el.querySelector('[data-act=memosaved]');
  let t=null;
  memo.addEventListener('input',()=>{
    saved.textContent='';
    clearTimeout(t);
    t=setTimeout(async()=>{
      try{await patch(x.id,{memo:memo.value},true);saved.textContent='保存したよ '+new Date().toLocaleTimeString('ja-JP');}
      catch(e){saved.textContent='保存に失敗…';}
    },800);
  });
}
async function patch(id,body,silent){
  const r=await api('/api/listings/'+encodeURIComponent(id),{method:'PATCH',body:JSON.stringify(body)});
  const i=DATA.findIndex(y=>y.id===id);
  if(i>=0)DATA[i]=r.item;
  if(!silent)render();else{const it=DATA[i];if(it){/* keep memo focus: update quietly */}}
  return r;
}
async function addItem(){
  const g=id=>$(id).value.trim();
  $('addErr').classList.add('hidden');
  try{
    const r=await api('/api/listings',{method:'POST',body:JSON.stringify({
      company:g('aCompany'),position:g('aPosition'),category:g('aCategory')||'手動追加',
      salary:g('aSalary'),location:g('aLocation'),remote:g('aRemote'),
      business:g('aBusiness'),requirements:g('aReq'),fit:g('aFit'),url:g('aUrl')
    })});
    DATA.unshift(r.item);buildCatFilter();render();
    $('modal').classList.add('hidden');
    ['aCompany','aPosition','aCategory','aSalary','aLocation','aRemote','aBusiness','aReq','aFit','aUrl'].forEach(id=>$(id).value='');
  }catch(e){const b=$('addErr');b.textContent=e.message;b.classList.remove('hidden');}
}
function toggle(id){$(id).classList.toggle('on');render()}
$('loginBtn').onclick=doLogin;
$('passcode').addEventListener('keydown',e=>{if(e.key==='Enter')doLogin()});
$('q').addEventListener('input',render);
$('fCat').onchange=render;$('fStatus').onchange=render;
$('fStar').onclick=()=>toggle('fStar');
$('fCurated').onclick=()=>toggle('fCurated');
$('fNew').onclick=()=>toggle('fNew');
$('fCaution').onclick=()=>toggle('fCaution');
$('fab').onclick=()=>$('modal').classList.remove('hidden');
$('addCancel').onclick=()=>$('modal').classList.add('hidden');
$('addSave').onclick=addItem;
boot();
</script>
</body>
</html>
